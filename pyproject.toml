[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "papaya-iiif"
version = "1.2.1"
description = "IIIF Presentation API implementation"
authors = [
    { name='University of Maryland Libraries', email='lib-ssdr@umd.edu' },
    { name='Peter Eichman', email='peichman@umd.edu' },
    { name='David Steelman', email='dsteelma@umd.edu' },
    { name='Marc Andreu Grillo Aguilar', email='aguilarm@umd.edu' },
]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "click",
    "configurenv",
    "codetiming",
    "flask",
    "jq",
    "pysolr",
    "python-dotenv",
    "pyyaml",
    "requests",
    "urlobject",
    "waitress",
    "flask-cors>=6.0.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "pdoc",
]

[project.scripts]
papaya = "papaya.server:run"

[tool.pytest.ini_options]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "single"
